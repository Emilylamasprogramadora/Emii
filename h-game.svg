<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 70" width="1000" height="70" role="img" aria-label="Play a Game" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e75a9b"/><stop offset="0.5" stop-color="#c77dff"/><stop offset="1" stop-color="#7ad7f0"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="r"><rect width="1000" height="70" rx="35"/></clipPath>
    <g id="f"><g>
      <ellipse cx="0" cy="-8" rx="5" ry="8"/><ellipse cx="0" cy="-8" rx="5" ry="8" transform="rotate(72)"/>
      <ellipse cx="0" cy="-8" rx="5" ry="8" transform="rotate(144)"/><ellipse cx="0" cy="-8" rx="5" ry="8" transform="rotate(216)"/>
      <ellipse cx="0" cy="-8" rx="5" ry="8" transform="rotate(288)"/></g><circle r="4" fill="#fff3a8"/></g>
  </defs>
  <rect width="1000" height="70" rx="35" fill="url(#g)"/>
  <g clip-path="url(#r)"><rect y="0" width="260" height="70" fill="url(#s)"><animate attributeName="x" values="-260;1000" dur="5s" repeatCount="indefinite"/></rect></g>
  <g transform="translate(45,35)"><use href="#f" fill="#ffffff"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/></use></g>
  <g transform="translate(955,35)"><use href="#f" fill="#fff3a8" transform="scale(1)"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/></use></g>
  <text x="500" y="46" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="32" font-weight="bold" letter-spacing="1" fill="#ffffff" stroke="#b3205f" stroke-width="3" paint-order="stroke">Play a Game</text>
</svg>
