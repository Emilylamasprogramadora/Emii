<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Banner de Loreine" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3ef"/>
      <stop offset="0.5" stop-color="#ffb3d1"/>
      <stop offset="1" stop-color="#e75a9b"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6fa5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff6fa5" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#a3195b" flood-opacity="0.35"/>
    </filter>
    <!-- Flor de 5 petalos: el color lo da el elemento que la usa -->
    <g id="flor">
      <g>
        <ellipse cx="0" cy="-10" rx="6" ry="10"/>
        <ellipse cx="0" cy="-10" rx="6" ry="10" transform="rotate(72)"/>
        <ellipse cx="0" cy="-10" rx="6" ry="10" transform="rotate(144)"/>
        <ellipse cx="0" cy="-10" rx="6" ry="10" transform="rotate(216)"/>
        <ellipse cx="0" cy="-10" rx="6" ry="10" transform="rotate(288)"/>
      </g>
      <circle r="4.5" fill="#fff3a8"/>
    </g>
    <!-- Petalo suelto -->
    <path id="petalo" d="M0,-9 C7,-5 7,5 0,9 C-7,5 -7,-5 0,-9 Z"/>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- Brillos de fondo -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="140" cy="70" r="3"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="40" r="2.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="60" r="3"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.4s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="150" r="2.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="250" r="2.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.1s" begin="-1.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Flores grandes flotando (colores distintos) -->
  <g>
    <g transform="translate(95,95)"><g><animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="5s" repeatCount="indefinite"/><use href="#flor" fill="#ff5c8a" transform="scale(2.6)"><animateTransform attributeName="transform" type="rotate" additive="sum" from="0" to="360" dur="30s" repeatCount="indefinite"/></use></g></g>
    <g transform="translate(250,60)"><g><animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="4s" begin="-1s" repeatCount="indefinite"/><use href="#flor" fill="#ffd84d" transform="scale(1.6)"/></g></g>
    <g transform="translate(1105,90)"><g><animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="5.5s" begin="-2s" repeatCount="indefinite"/><use href="#flor" fill="#c77dff" transform="scale(2.8)"/></g></g>
    <g transform="translate(960,48)"><g><animateTransform attributeName="transform" type="translate" values="0,0;0,-9;0,0" dur="3.6s" begin="-1.5s" repeatCount="indefinite"/><use href="#flor" fill="#ff9a3c" transform="scale(1.7)"/></g></g>
    <g transform="translate(60,300)"><g><animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="4.6s" begin="-3s" repeatCount="indefinite"/><use href="#flor" fill="#7ad7f0" transform="scale(1.9)"/></g></g>
    <g transform="translate(1140,290)"><g><animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="4.2s" begin="-0.5s" repeatCount="indefinite"/><use href="#flor" fill="#ffffff" transform="scale(2.1)"/></g></g>
  </g>

  <!-- Petalos y flores pequenas que caen -->
  <g>
    <g><use href="#petalo" fill="#ffffff" transform="scale(0.9)"/><animateTransform attributeName="transform" type="translate" values="180,-20;230,440" dur="9s" begin="0s" repeatCount="indefinite"/></g>
    <g><use href="#petalo" fill="#ff5c8a"/><animateTransform attributeName="transform" type="translate" values="330,-20;290,440" dur="11s" begin="-4s" repeatCount="indefinite"/></g>
    <g><use href="#flor" fill="#ffd84d" transform="scale(0.7)"/><animateTransform attributeName="transform" type="translate" values="470,-20;520,440" dur="12s" begin="-7s" repeatCount="indefinite"/></g>
    <g><use href="#petalo" fill="#c77dff" transform="scale(1.1)"/><animateTransform attributeName="transform" type="translate" values="620,-20;570,440" dur="10s" begin="-2s" repeatCount="indefinite"/></g>
    <g><use href="#petalo" fill="#ffffff"/><animateTransform attributeName="transform" type="translate" values="760,-20;820,440" dur="13s" begin="-9s" repeatCount="indefinite"/></g>
    <g><use href="#flor" fill="#ff9a3c" transform="scale(0.7)"/><animateTransform attributeName="transform" type="translate" values="880,-20;840,440" dur="11s" begin="-5s" repeatCount="indefinite"/></g>
    <g><use href="#petalo" fill="#ff6fa5" transform="scale(1.2)"/><animateTransform attributeName="transform" type="translate" values="1010,-20;1060,440" dur="9.5s" begin="-3s" repeatCount="indefinite"/></g>
    <g><use href="#petalo" fill="#7ad7f0"/><animateTransform attributeName="transform" type="translate" values="130,-20;90,440" dur="14s" begin="-6s" repeatCount="indefinite"/></g>
  </g>

  <!-- Nombre -->
  <g filter="url(#glow)">
    <text x="600" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="110" font-weight="bold" font-style="italic" fill="#ffffff" stroke="#b3205f" stroke-width="3" paint-order="stroke">Loreine
      <animate attributeName="opacity" values="0.88;1;0.88" dur="3.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Linea decorativa que se desliza -->
  <rect x="300" y="212" width="600" height="4" rx="2" fill="url(#bar)">
    <animate attributeName="x" values="260;340;260" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtitulo -->
  <text x="600" y="258" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="25" letter-spacing="2" fill="#6b1148" filter="url(#soft)">Developer in training  |  Excel Certified  |  Python Learner</text>

  <!-- Logos de habilidades flotando -->
  <g font-family="'Trebuchet MS', Verdana, sans-serif" font-weight="bold" text-anchor="middle" filter="url(#soft)">
    <g transform="translate(300,345)"><g><animateTransform attributeName="transform" type="translate" values="0,0;0,-16;0,0" dur="4s" repeatCount="indefinite"/>
      <circle r="31" fill="#ffffff" stroke="#1d8f4e" stroke-width="4"/><text y="8" font-size="22" fill="#1d8f4e">XL</text></g></g>
    <g transform="translate(420,345)"><g><animateTransform attributeName="transform" type="translate" values="0,0;0,-16;0,0" dur="4.6s" begin="-1s" repeatCount="indefinite"/>
      <circle r="31" fill="#ffffff" stroke="#3776ab" stroke-width="4"/><text y="8" font-size="22" fill="#3776ab">PY</text></g></g>
    <g transform="translate(540,345)"><g><animateTransform attributeName="transform" type="translate" values="0,0;0,-16;0,0" dur="3.8s" begin="-2s" repeatCount="indefinite"/>
      <circle r="31" fill="#ffffff" stroke="#ff5c8a" stroke-width="4"/><text y="8" font-size="22" fill="#ff5c8a">GH</text></g></g>
    <g transform="translate(660,345)"><g><animateTransform attributeName="transform" type="translate" values="0,0;0,-16;0,0" dur="4.4s" begin="-0.5s" repeatCount="indefinite"/>
      <circle r="31" fill="#ffffff" stroke="#e75a9b" stroke-width="4"/><text y="8" font-size="22" fill="#e75a9b">EN</text></g></g>
    <g transform="translate(780,345)"><g><animateTransform attributeName="transform" type="translate" values="0,0;0,-16;0,0" dur="5s" begin="-3s" repeatCount="indefinite"/>
      <circle r="31" fill="#ffffff" stroke="#9d4edd" stroke-width="4"/><text y="8" font-size="22" fill="#9d4edd">UX</text></g></g>
    <g transform="translate(900,345)"><g><animateTransform attributeName="transform" type="translate" values="0,0;0,-16;0,0" dur="4.2s" begin="-1.5s" repeatCount="indefinite"/>
      <circle r="31" fill="#ffffff" stroke="#ff9a3c" stroke-width="4"/><text y="8" font-size="22" fill="#e07b13">DS</text></g></g>
  </g>
</svg>
